name: CI

# The README says "a lint failure is a build failure" — this is the build that
# makes that true. Nothing enforced eslint, pyflakes, either suite or either
# coverage gate before: the green baseline was one maintainer's machine.

# Every job executes checked-out repository or dependency code; none writes to
# the repository, so none gets a token that can.
permissions:
  contents: read

# A superseded pull-request run proves nothing about the head commit, and every
# job below executes checked-out code, so an abandoned push kept a runner busy
# until it finished. Pushes to `develop` and `v*` tags are deliberately excluded:
# `packaging` uploads the artifact `release` downloads under the commit SHA, and
# cancelling one of those mid-flight leaves the tag with no validated package.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # the dependency audit only: an advisory can land against an untouched
    # repository, and nothing else here changes without a commit
    - cron: '17 6 * * 1'

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # npm ci, both linters and both suites; ~3 min observed
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.13.0'
            python: '3.12'
          - node: 26
            python: '3.14'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Exercise the supported Node/developer-Python floors and the current versions
      # without multiplying two independent compatibility axes into four jobs.
      #
      # The suite's Python floor was 3.8 and is 3.12. 3.8 went end of life in October
      # 2024, before ubuntu-24.04 entered actions/python-versions' build matrix,
      # so pinning the image (which the template comparison below needs) left
      # this leg asking setup-python for an interpreter that image may carry no
      # build of — a floor that cannot be provisioned verifies nothing. 3.12 is
      # what ubuntu-24.04 ships as its system Python.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      # pyflakes is what lint:py runs. It used to skip itself when the import
      # failed — exit 0 either way — so the Python lint was a no-op on any
      # machine that did not happen to have it. It fails now, so CI installs it.
      #
      # pytz is what the settings dialog resolves timezones with, and CI did not
      # install it: sixteen tests skipped themselves here and the coverage gate
      # printed byte-identical numbers, so the line that wires pytz into the
      # dialog was verified on a maintainer's laptop and nowhere else.
      - run: python3 -m pip install pyflakes==3.2.0 pytz==2026.2

      - run: npm ci

      # Python 3.10 shipped-source syntax plus eslint and pyflakes.
      - run: npm run lint

      # Both suites, both coverage gates: JS 98/90/100 per file, Python 98 lines.
      # CHRONOS_REQUIRE_PYTZ turns the pytz skips into a failure, so a future
      # dependency drop cannot quietly take those sixteen tests out of CI again.
      - run: npm test
        env:
          CHRONOS_REQUIRE_PYTZ: "1"

  # Node packages are development tooling only; none enters the Spices
  # artifact, so an advisory against one cannot reach a user. `npm audit`
  # queries registry.npmjs.org at run time, and this job used to sit inside
  # `gates`, which `packaging` needs and `release` needs after it: a newly
  # published advisory against any of the locked dev packages turned an
  # unchanged commit red and blocked cutting a tag, and re-running the same SHA
  # was not reproducible. It reports on its own now, and the weekly run means an
  # advisory published between commits is still seen.
  audit:
    runs-on: ubuntu-24.04
    # one registry query
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci
      - run: npm run audit:deps

  packaging:
    needs: gates
    runs-on: ubuntu-24.04
    # apt-installs cinnamon and gettext before the catalog gate
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      # gettext validates every catalog. Cinnamon supplies the same extraction
      # command contributors use through po/makepot, so a stale template, a
      # msgid a catalog is missing, and a source reference the template no
      # longer names all fail here instead of churning in the Spices tooling.
      #
      # These two packages are the template generator, and the job holds their
      # output against a committed file. `ubuntu-latest` rolling to the next LTS
      # would swap them under that assertion on an unchanged repository, which
      # is why every job above pins the image; the comparison itself is over
      # extracted content rather than bytes, so xgettext's wrapping is free to
      # differ within the pin.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends cinnamon gettext

      - run: npm ci

      # This job installs Cinnamon, so it is the one job that has the runtime
      # the applet actually runs on. eslint and the Node suite parse the tree
      # with espree and with Node; neither is cjs, and a form both accept and
      # SpiderMonkey rejects would otherwise ship green. Syntax only, and only
      # on whichever cjs this image carries — not the declared 6.0 floor.
      - run: npm run check:cjs-syntax

      - run: npm run release:check
      - run: npm run i18n:check
      - run: npm run package:spices

      # upload-artifact normalizes modes when it archives a directory. Put the
      # validated tree and its checksum manifest inside one tar first, so every
      # tracked executable remains executable after download.
      - name: Archive validated Spices package
        run: scripts/archive-spices.sh dist

      # Preserve the exact tree that passed the package and catalog gates. The
      # tag job and the maintainer both consume this artifact; neither rebuilds
      # release bytes from a potentially dirty local checkout.
      - name: Upload validated Spices package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chronos-spices-${{ github.sha }}
          path: dist/chronos-spices.tar
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packaging
    runs-on: ubuntu-24.04
    # checkout, npm ci and the artifact round trip
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci
      - name: Fetch release branch
        run: git fetch --no-tags origin develop:refs/remotes/origin/develop
      - run: npm run release:check -- "$GITHUB_REF_NAME" origin/develop

      - name: Download validated Spices package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chronos-spices-${{ github.sha }}
          path: dist/

      - name: Verify downloaded Spices package
        working-directory: dist
        run: |
          tar -xf chronos-spices.tar
          sha256sum -c chronos-spices.sha256
          test -f chronos@geraldo-netto/files/chronos@geraldo-netto/metadata.json
          # sha256sum records digests, which carry no mode bits, so the manifest
          # above passes on a tree that lost a +x in the upload/download round
          # trip. The modes were asserted from a hand-listed trio that drifted to
          # half the tracked set; read the set from the index instead.
          git -C "$GITHUB_WORKSPACE" ls-files --stage -- README.md files info.json screenshot.png \
            | awk -F'\t' '$1 ~ /^100755 / { print $2 }' > tracked-executables
          test -s tracked-executables
          while read -r tracked; do
            mode=$(stat -c '%a' "chronos@geraldo-netto/$tracked")
            echo "$tracked: $mode"
            test "$mode" = 755
          done < tracked-executables
          rm tracked-executables
