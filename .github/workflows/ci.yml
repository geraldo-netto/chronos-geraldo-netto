name: CI

# The README says "a lint failure is a build failure" — this is the build that
# makes that true. Nothing enforced eslint, pyflakes, either suite or either
# coverage gate before: the green baseline was one maintainer's machine.
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      # Exercise both the declared floor and the current runtime used for
      # development; node:test coverage behavior is part of the gate.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyflakes is what lint:py runs. It used to skip itself when the import
      # failed — exit 0 either way — so the Python lint was a no-op on any
      # machine that did not happen to have it. It fails now, so CI installs it.
      #
      # pytz is what the settings dialog resolves timezones with, and CI did not
      # install it: sixteen tests skipped themselves here and the coverage gate
      # printed byte-identical numbers, so the line that wires pytz into the
      # dialog was verified on a maintainer's laptop and nowhere else.
      - run: python3 -m pip install --upgrade pyflakes pytz

      - run: npm ci

      - run: npm run lint

      # both suites, both coverage gates: JS 98/90/100 per file, Python 98 lines.
      # CHRONOS_REQUIRE_PYTZ turns the pytz skips into a failure, so a future
      # dependency drop cannot quietly take those sixteen tests out of CI again.
      - run: npm test
        env:
          CHRONOS_REQUIRE_PYTZ: "1"

  packaging:
    needs: gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # gettext validates every catalog. Cinnamon supplies the same extraction
      # command contributors use through po/makepot, so stale source references
      # and msgids fail here instead of churning in the Spices tooling.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends cinnamon gettext

      - run: npm ci
      - run: npm run release:check
      - run: npm run i18n:check
      - run: npm run package:spices

      # Preserve the exact tree that passed the package and catalog gates. The
      # tag job and the maintainer both consume this artifact; neither rebuilds
      # release bytes from a potentially dirty local checkout.
      - name: Upload validated Spices package
        uses: actions/upload-artifact@v4
        with:
          name: chronos-spices-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/chronos@geraldo-netto/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Download validated Spices package
        uses: actions/download-artifact@v4
        with:
          name: chronos-spices-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/chronos@geraldo-netto/

      - name: Verify downloaded package layout
        run: test -f dist/chronos@geraldo-netto/files/chronos@geraldo-netto/metadata.json
