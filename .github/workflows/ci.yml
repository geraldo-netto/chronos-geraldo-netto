name: CI

# The README says "a lint failure is a build failure" — this is the build that
# makes that true. Nothing enforced eslint, pyflakes, either suite or either
# coverage gate before: the green baseline was one maintainer's machine.

# Every job runs repository and dependency code (npm ci, npm test); none of
# them writes to the repo, so none of them gets a token that can.
permissions:
  contents: read

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.13.0'
            python: '3.8'
          - node: 26
            python: '3.14'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Exercise both runtime floors and the current development versions
      # without multiplying two independent compatibility axes into four jobs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      # pyflakes is what lint:py runs. It used to skip itself when the import
      # failed — exit 0 either way — so the Python lint was a no-op on any
      # machine that did not happen to have it. It fails now, so CI installs it.
      #
      # pytz is what the settings dialog resolves timezones with, and CI did not
      # install it: sixteen tests skipped themselves here and the coverage gate
      # printed byte-identical numbers, so the line that wires pytz into the
      # dialog was verified on a maintainer's laptop and nowhere else.
      - run: python3 -m pip install pyflakes==3.2.0 pytz==2026.2

      - run: npm ci

      # Node packages are development tooling only; none enters the Spices
      # artifact. Audit that toolchain and fail on high/critical advisories.
      - run: npm run audit:deps

      - run: npm run lint

      # both suites, both coverage gates: JS 98/90/100 per file, Python 98 lines.
      # CHRONOS_REQUIRE_PYTZ turns the pytz skips into a failure, so a future
      # dependency drop cannot quietly take those sixteen tests out of CI again.
      - run: npm test
        env:
          CHRONOS_REQUIRE_PYTZ: "1"

  packaging:
    needs: gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      # gettext validates every catalog. Cinnamon supplies the same extraction
      # command contributors use through po/makepot, so stale source references
      # and msgids fail here instead of churning in the Spices tooling.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends cinnamon gettext

      - run: npm ci
      - run: npm run release:check
      - run: npm run i18n:check
      - run: npm run package:spices

      # upload-artifact normalizes modes when it archives a directory. Put the
      # validated tree and its checksum manifest inside one tar first, so the
      # three tracked executables remain executable after download.
      - name: Archive validated Spices package
        working-directory: dist
        run: |
          find chronos@geraldo-netto -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > chronos-spices.sha256
          tar -cf chronos-spices.tar chronos-spices.sha256 chronos@geraldo-netto

      # Preserve the exact tree that passed the package and catalog gates. The
      # tag job and the maintainer both consume this artifact; neither rebuilds
      # release bytes from a potentially dirty local checkout.
      - name: Upload validated Spices package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chronos-spices-${{ github.sha }}
          path: dist/chronos-spices.tar
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci
      - name: Fetch release branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm run release:check -- "$GITHUB_REF_NAME" origin/main

      - name: Download validated Spices package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chronos-spices-${{ github.sha }}
          path: dist/

      - name: Verify downloaded Spices package
        working-directory: dist
        run: |
          tar -xf chronos-spices.tar
          sha256sum -c chronos-spices.sha256
          test -f chronos@geraldo-netto/files/chronos@geraldo-netto/metadata.json
          test "$(stat -c '%a' chronos@geraldo-netto/files/chronos@geraldo-netto/5.4/settings_widgets.py)" = 755
          test "$(stat -c '%a' chronos@geraldo-netto/files/chronos@geraldo-netto/settings_widgets_common.py)" = 755
          test "$(stat -c '%a' chronos@geraldo-netto/files/chronos@geraldo-netto/po/makepot)" = 755
