# Automatic analysis otherwise treats every JavaScript and Python file as
# production. Keep test doubles out of production metrics and test coverage.
sonar.sources=files,scripts
sonar.tests=test

# Cinnamon stylesheets target StTheme, not browser CSS. Its valid `icon-size`
# property is outside the browser-CSS vocabulary used by css:S4654.
sonar.exclusions=files/chronos@geraldo-netto/5.4/stylesheet.css

sonar.sourceEncoding=UTF-8
